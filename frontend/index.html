    <meta name="description" content="KMnO4 的个人博客，记录代码、阅读与生活。" />
    <meta name="keywords" content="KMnO4, 博客, 前端开发, Vue 3, FastAPI, 阅读笔记" />

    <meta property="og:locale" content="zh_CN" />
    <link rel="alternate" type="application/rss+xml" title="KMnO4 的博客" href="/rss.xml" />
    <meta name="theme-color" content="#fbfbf8" />
    <script>
      ;(() => {
        const saved = (() => {
          try {
            return localStorage.getItem('theme')
          } catch {
            return null
          }
        })()
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#131614' : '#fbfbf8')
      })()
    </script>
    <title>KMnO4 的博客</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
