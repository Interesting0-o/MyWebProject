services:
  backend:
    build:
      context: ./backend
    ports:
      - '8000:8000'
    depends_on:
      - db
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      BACKEND_PORT: ${BACKEND_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
  db:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PWD}
      MYSQL_DATABASE: ${DATABASE_NAME}
